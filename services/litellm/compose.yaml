services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.95.0
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-anthropic/<model-id>}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/<model-id>}
      LITELLM_VLLM_MODEL: hosted_vllm/${VLLM_SERVED_MODEL_NAME:-local}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:4000:4000"
    volumes:
      - ../../services/litellm/config/config.yaml:/app/config.yaml:ro
      - ${LITELLM_DATA_SOURCE:-litellm-data}:/app/data
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - llm-api

networks:
  llm-api:

volumes:
  litellm-data:
