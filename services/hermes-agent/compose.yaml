services:
  hermes-postgres:
    image: postgres:16
    container_name: hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: ${HERMES_PG_PASSWORD:?}
      POSTGRES_DB: hermes
    volumes:
      - ${DATA_ROOT:?}/db/hermes-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - agent-net

  hermes-agent:
    image: nousresearch/hermes-agent:1
    container_name: hermes-agent
    restart: unless-stopped
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HERMES_WRITE_SAFE_ROOT: /vault
      HERMES_DB_URL: postgresql://hermes:${HERMES_PG_PASSWORD:?}@hermes-postgres:5432/hermes
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ${DATA_ROOT:?}/db/hermes:/data
      - ${DATA_ROOT:?}/documents/vault:/vault
      - ${DATA_ROOT:?}/documents/vault/90_Sources:/vault/90_Sources:ro
    depends_on:
      hermes-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - agent-net
      - llm-net

networks:
  agent-net:
    driver: bridge
  llm-net:
    external: true
