services:
  bookorbit-postgres:
    image: pgvector/pgvector:pg18-trixie
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      POSTGRES_USER: bookorbit
      POSTGRES_DB: bookorbit
      POSTGRES_PASSWORD: ${BOOKORBIT_DB_PASSWORD:?BOOKORBIT_DB_PASSWORD is required}
    volumes:
      - ${BOOKORBIT_DB_SOURCE:-bookorbit-db}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-bookorbit} -d $${POSTGRES_DB:-bookorbit}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    networks:
      - bookorbit-db

  bookorbit-app:
    image: ghcr.io/bookorbit/bookorbit:latest
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: bookorbit-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: bookorbit
      POSTGRES_DB: bookorbit
      POSTGRES_PASSWORD: ${BOOKORBIT_DB_PASSWORD:?BOOKORBIT_DB_PASSWORD is required}
      JWT_SECRET: ${BOOKORBIT_JWT_SECRET:?BOOKORBIT_JWT_SECRET is required}
      SETUP_BOOTSTRAP_TOKEN: ${BOOKORBIT_SETUP_BOOTSTRAP_TOKEN:?BOOKORBIT_SETUP_BOOTSTRAP_TOKEN is required}
      APP_URL: ${BOOKORBIT_APP_URL:?BOOKORBIT_APP_URL is required}
      PUID: ${LIBRARY_UID:-1000}
      PGID: ${LIBRARY_GID:-1000}
      LIBRARY_BROWSE_ROOT: /books
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    volumes:
      - ${LIBRARY_SOURCE:-shares}:/books:ro
      - ${BOOKORBIT_APP_DATA_SOURCE:-bookorbit-app-data}:/data
    depends_on:
      bookorbit-postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    networks:
      - bookorbit-db
      - bookorbit-egress

networks:
  bookorbit-db:
    internal: true
  bookorbit-egress:

volumes:
  bookorbit-db:
  bookorbit-app-data:
  shares:
