services:
  jellyfin-data-init:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R ${LIBRARY_UID:-1000}:${LIBRARY_GID:-1000} /config /cache"]
    volumes:
      - ${JELLYFIN_CONFIG_SOURCE:-jellyfin-config}:/config
      - ${JELLYFIN_CACHE_SOURCE:-jellyfin-cache}:/cache
    restart: "no"

  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    restart: unless-stopped
    user: "${LIBRARY_UID:-1000}:${LIBRARY_GID:-1000}"
    depends_on:
      jellyfin-data-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8096:8096"
    volumes:
      - ${JELLYFIN_CONFIG_SOURCE:-jellyfin-config}:/config
      - ${JELLYFIN_CACHE_SOURCE:-jellyfin-cache}:/cache
      - ${LIBRARY_SOURCE:-shares}:/library:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8096/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true

volumes:
  jellyfin-config:
  jellyfin-cache:
  shares:
