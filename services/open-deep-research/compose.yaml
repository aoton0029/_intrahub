services:
  odr-redis:
    image: redis:7-alpine
    container_name: odr-redis
    restart: unless-stopped
    networks:
      - research-net

  odr-postgres:
    image: postgres:16
    container_name: odr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: odr
      POSTGRES_PASSWORD: ${ODR_PG_PASSWORD:?}
      POSTGRES_DB: odr
    volumes:
      - ${DATA_ROOT:?}/db/odr-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odr"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - research-net

  open-deep-research:
    image: open-deep-research:${ODR_IMAGE_TAG:?}
    container_name: open-deep-research
    restart: unless-stopped
    environment:
      OPENAI_API_BASE: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?}
      REDIS_URI: redis://odr-redis:6379
      DATABASE_URI: postgresql://odr:${ODR_PG_PASSWORD:?}@odr-postgres:5432/odr?sslmode=disable
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
    depends_on:
      odr-redis:
        condition: service_started
      odr-postgres:
        condition: service_healthy
    networks:
      - research-net
      - llm-net
      - proxy-net

networks:
  research-net:
    driver: bridge
  llm-net:
    external: true
  proxy-net:
    external: true
