services:
  bookmarks:
    image: ghcr.io/hacdias/webdav:v5.14.1
    restart: unless-stopped
    command: ["-c", "/config.yml"]
    environment:
      BOOKMARKS_USER: ${BOOKMARKS_USER:-intrahub}
      BOOKMARKS_PASSWORD: ${BOOKMARKS_PASSWORD:?BOOKMARKS_PASSWORD is required}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:8082:6065"
    volumes:
      - ../../services/bookmarks/config/config.yml:/config.yml:ro
      - ${BOOKMARKS_DATA_SOURCE:-bookmarks-data}:/data
    security_opt:
      - no-new-privileges:true

volumes:
  bookmarks-data:
