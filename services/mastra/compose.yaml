services:
  mastra:
    image: ghcr.io/aoton0029/intrahub-mastra:0.1.0
    container_name: mastra
    restart: unless-stopped
    environment:
      # LiteLLM のエンドポイントは IntraHub 内の固定値
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?}
      # LibSQL の保存先。既定は cwd の mastra.db なので、永続ボリューム配下へ寄せる
      TURSO_DATABASE_URL: file:/app/data/mastra.db
    volumes:
      - ${DATA_ROOT:?}/db/mastra:/app/data
    networks:
      - llm-net
      - proxy-net

networks:
  llm-net:
    external: true
  proxy-net:
    external: true
