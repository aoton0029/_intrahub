services:
  vllm:
    image: vllm/vllm-openai:v0.26.0
    container_name: vllm
    restart: unless-stopped
    user: "2000:0"
    security_opt:
      - no-new-privileges:true
    shm_size: "4gb"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - "--model"
      - "openai/gpt-oss-20b"
      - "--served-model-name"
      - "local-agent-model"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "32768"
      - "--max-num-seqs"
      - "1"
      - "--gpu-memory-utilization"
      - "0.90"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "openai"
      - "--reasoning-parser"
      - "gptoss"
      - "--api-key"
      - "${VLLM_API_KEY:?}"
    volumes:
      - ${DATA_ROOT:?}/models/vllm:/home/vllm/.cache/huggingface
      - ${DATA_ROOT:?}/cache/vllm:/home/vllm/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
    networks:
      - ai-net

networks:
  ai-net:
    external: true
