services:
  vllm-init:
    image: busybox:1.37.0
    restart: "no"
    user: "0:0"
    command: ["sh", "-ec", "chown 2000:0 /cache"]
    volumes:
      - ${VLLM_CACHE_SOURCE:-vllm-cache}:/cache
    security_opt:
      - no-new-privileges:true

  vllm:
    image: vllm/vllm-openai:v0.26.0
    restart: unless-stopped
    user: "2000:0"
    environment:
      VLLM_API_KEY: ${VLLM_API_KEY:?VLLM_API_KEY is required}
      HF_TOKEN: ${HF_TOKEN:-}
    shm_size: ${VLLM_SHM_SIZE:-4gb}
    command:
      - --model
      - ${VLLM_MODEL:?VLLM_MODEL is required}
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-local}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - $${VLLM_API_KEY}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS:-1}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ${VLLM_TOOL_CALL_PARSER:-openai}
    volumes:
      - ${VLLM_CACHE_SOURCE:-vllm-cache}:/home/vllm/.cache
    depends_on:
      vllm-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 15m
    security_opt:
      - no-new-privileges:true
    networks:
      - llm-api

networks:
  llm-api:

volumes:
  vllm-cache:
